<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Catalogue of Temptations</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --crimson: #8B0000;
    --blood: #C41230;
    --rose: #E8325A;
    --flesh: #D4956A;
    --pale-flesh: #E8C4A0;
    --electric-blue: #1A4FD6;
    --lake-blue: #2D7DD2;
    --acid-yellow: #D4C11A;
    --deep-dark: #0A0608;
    --dark-wine: #1A0308;
    --lace-cream: rgba(230, 200, 170, 0.15);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--deep-dark);
    overflow: hidden;
    font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
    color: rgba(230, 200, 170, 0.8);
    cursor: none;
  }

  #custom-cursor {
    position: fixed; width: 6px; height: 6px;
    background: rgba(200, 50, 60, 0.7);
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: width 0.2s, height 0.2s, background 0.3s;
    z-index: 9999;
    mix-blend-mode: screen;
  }
  #custom-cursor.active { width: 14px; height: 14px; background: rgba(232, 50, 90, 0.9); }

  /* ── MAIN CANVAS ── */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }

  canvas#main-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
  }

  canvas#lace-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s;
  }

  canvas#paint-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── LANDING ── */
  #landing {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 12vh;
    z-index: 10;
    pointer-events: none;
  }

  #landing h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.2rem, 3vw, 2.2rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(220, 180, 160, 0.6);
    margin-bottom: 0.4em;
    text-align: center;
  }

  #landing .subtitle {
    font-size: clamp(0.6rem, 1.2vw, 0.85rem);
    letter-spacing: 0.6em;
    color: rgba(180, 120, 100, 0.4);
    margin-bottom: 3rem;
    text-align: center;
  }

  #start-btn {
    pointer-events: all;
    background: transparent;
    border: 1px solid rgba(180, 80, 80, 0.4);
    color: rgba(220, 150, 130, 0.7);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    padding: 0.9em 2.5em;
    cursor: none;
    transition: all 0.6s ease;
    position: relative;
    overflow: hidden;
  }

  #start-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(139, 0, 0, 0.15);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.6s ease;
  }

  #start-btn:hover {
    color: rgba(240, 180, 160, 0.95);
    border-color: rgba(196, 18, 48, 0.7);
  }
  #start-btn:hover::after { transform: scaleX(1); }

  /* ── QUESTION UI ── */
  #question-ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 8vh;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
  }

  #question-ui.visible { opacity: 1; pointer-events: all; }

  #question-counter {
    font-size: 0.6rem;
    letter-spacing: 0.5em;
    color: rgba(180, 100, 80, 0.4);
    margin-bottom: 1.5rem;
    text-transform: uppercase;
  }

  #question-text {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    color: rgba(230, 190, 170, 0.75);
    text-align: center;
    margin-bottom: 2rem;
    max-width: 600px;
    padding: 0 2rem;
    line-height: 1.6;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.8s, transform 0.8s;
  }

  #question-text.visible { opacity: 1; transform: translateY(0); }

  #answer-wrapper {
    position: relative;
    width: min(500px, 80vw);
  }

  #answer-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid rgba(180, 80, 80, 0.3);
    color: rgba(230, 200, 180, 0.85);
    font-family: 'Cormorant Garamond', 'Noto Serif SC', 'STSong', serif;
    font-size: clamp(0.9rem, 2vw, 1.15rem);
    padding: 0.6em 0;
    text-align: center;
    letter-spacing: 0.05em;
    outline: none;
    caret-color: rgba(196, 18, 48, 0.8);
    transition: border-color 0.4s;
    ime-mode: active;
  }

  #answer-input::placeholder {
    color: rgba(180, 120, 100, 0.25);
    font-style: italic;
    letter-spacing: 0.2em;
  }

  #answer-input:focus { border-bottom-color: rgba(196, 18, 48, 0.6); }

  #submit-btn {
    display: block; margin: 2.5rem auto 0;
    background: transparent;
    border: none;
    color: rgba(200, 130, 110, 0.5);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.65rem;
    letter-spacing: 0.6em;
    text-transform: uppercase;
    cursor: none;
    transition: color 0.4s;
    padding: 0.5em 1em;
  }

  #submit-btn:hover { color: rgba(232, 50, 90, 0.85); }

  /* ── PROCESSING ── */
  #processing {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
  }

  #processing.visible { opacity: 1; }

  #processing-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.75rem;
    letter-spacing: 0.5em;
    color: rgba(180, 100, 90, 0.6);
    text-transform: uppercase;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }

  /* ── INTERACTION HINT ── */
  #interact-hint {
    position: fixed; bottom: 4vh; left: 50%; transform: translateX(-50%);
    font-size: 0.55rem;
    letter-spacing: 0.5em;
    color: rgba(180, 100, 80, 0.3);
    text-transform: uppercase;
    z-index: 15;
    opacity: 0;
    transition: opacity 2s;
    pointer-events: none;
  }

  /* ── FINAL OUTPUT ── */
  #final-ui {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 6vh;
    z-index: 25;
    opacity: 0;
    pointer-events: none;
    transition: opacity 2s;
  }

  #final-ui.visible { opacity: 1; pointer-events: all; }

  #final-poem {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: clamp(0.75rem, 1.5vw, 1rem);
    color: rgba(220, 180, 155, 0.5);
    text-align: center;
    line-height: 1.9;
    margin-bottom: 1rem;
    max-width: 400px;
    padding: 0 2rem;
  }

  #final-quote {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.55rem, 1vw, 0.76rem);
    color: rgba(185, 130, 110, 0.32);
    text-align: center;
    line-height: 1.75;
    margin-bottom: 2rem;
    max-width: 460px;
    padding: 0 2.5rem;
    letter-spacing: 0.02em;
  }

  .final-btns { display: flex; gap: 1.5rem; align-items: center; }

  .final-btn {
    background: transparent;
    border: 1px solid rgba(180, 80, 80, 0.35);
    color: rgba(220, 150, 130, 0.7);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    padding: 0.8em 2em;
    cursor: none;
    transition: all 0.5s;
  }

  .final-btn:hover {
    color: rgba(240, 180, 160, 1);
    border-color: rgba(196, 18, 48, 0.6);
    background: rgba(139, 0, 0, 0.12);
  }

  /* ── DRAG HINT ── */
  #click-hint {
    position: fixed;
    bottom: 20vh;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25em;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 2s;
    text-align: center;
  }
  #click-hint span {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.55rem;
    letter-spacing: 0.4em;
    color: rgba(200, 140, 120, 0.35);
    text-transform: uppercase;
    display: block;
  }

  #drag-hint {
    position: fixed; top: 4vh; right: 3vw;
    font-size: 0.5rem;
    letter-spacing: 0.4em;
    color: rgba(180, 100, 80, 0.25);
    text-transform: uppercase;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 3s;
    writing-mode: vertical-rl;
  }

  #params-display {
    position: fixed; top: 4vh; left: 3vw;
    font-size: 0.45rem;
    letter-spacing: 0.15em;
    color: rgba(180, 100, 80, 0.18);
    z-index: 15;
    pointer-events: none;
    line-height: 2;
    opacity: 0;
    transition: opacity 2s;
  }
</style>
</head>
<body>

<div id="custom-cursor"></div>

<div id="stage">
  <canvas id="main-canvas"></canvas>
  <canvas id="paint-canvas"></canvas>
  <canvas id="lace-canvas"></canvas>
</div>

<!-- LANDING -->
<div id="landing">
  <h1>A Catalogue of Temptations</h1>
  <div class="subtitle">Qingyu Zheng</div>
  <button id="start-btn">enter</button>
</div>

<!-- QUESTION FLOW -->
<div id="question-ui">
  <div id="question-counter"></div>
  <div id="question-text"></div>
  <div id="answer-wrapper">
    <input id="answer-input" type="text" placeholder="whisper here… 在此低语" autocomplete="off" spellcheck="false" lang="zh-CN" inputmode="text">
  </div>
  <button id="submit-btn">continue →</button>
</div>

<!-- PROCESSING -->
<div id="processing">
  <div id="processing-text">the body is listening</div>
</div>

<!-- INTERACTION HINT -->
<div id="interact-hint">click · drag · touch</div>
<div id="click-hint">
  <span>click anywhere · each click transforms</span>
  <span style="font-size:0.85em;opacity:0.7">&#x70b9;&#x51fb;&#x753b;&#x9762;&#xff0c;&#x6bcf;&#x6b21;&#x70b9;&#x51fb;&#x6539;&#x53d8;&#x5f62;&#x6001;</span>
</div>

<!-- DRAG HINT -->
<div id="drag-hint">touch to deform</div>

<!-- PARAMS DISPLAY -->
<div id="params-display"></div>

<!-- FINAL -->
<div id="final-ui">
  <div id="final-poem"></div>
  <div id="final-quote"></div>
  <div class="final-btns">
    <button class="final-btn" id="save-btn">save image</button>
    <button class="final-btn" id="restart-btn">begin again</button>
  </div>
</div>

function randColor(bias) {
  const map = { crimson:'crimson', flesh:'flesh', electric_blue:'electricBlue',
    pink:'pink', blood:'blood', rose:'rose', yellow:'acidYellow', green:'green',
    blue:'lakeBlue', teal:'teal', olive:'olive', lilac:'lilac',
    mauve:'mauve', sienna:'sienna', sage:'sageGreen', lavender:'lavender',
    dusty_rose:'dustyRose', blush:'blush', ochre:'ochre', prussian:'prussian' };
  const keys = bias.map(b => map[b] || b).filter(k => PALETTE[k]);
  const k = keys.length ? keys[Math.floor(Math.random()*keys.length)] : 'crimson';
  return PALETTE[k];
}

function blendColor(bias, t) {
  const map = { crimson:'crimson', flesh:'flesh', electric_blue:'electricBlue',
    pink:'pink', blood:'blood', rose:'rose', yellow:'acidYellow', green:'green',
    blue:'lakeBlue' };
  const keys = bias.map(b => map[b] || b).filter(k => PALETTE[k]);
  if (!keys.length) keys.push('crimson');
  const i = Math.floor(t * (keys.length - 1));
  const f = (t * (keys.length - 1)) - i;
  const c1 = PALETTE[keys[Math.min(i, keys.length-1)]];
  const c2 = PALETTE[keys[Math.min(i+1, keys.length-1)]];
  return [c1[0]+(c2[0]-c1[0])*f, c1[1]+(c2[1]-c1[1])*f, c1[2]+(c2[2]-c1[2])*f];
}

// ── SIMPLEX-LIKE NOISE ──
function noise(x, y, t) {
  return Math.sin(x*0.5+t)*Math.cos(y*0.3+t*0.7)*Math.sin(x*0.2-y*0.1+t*1.3)*Math.cos(x*0.08+y*0.15+t*0.4);
}
function sn(x,y,t){
  return (noise(x,y,t)+noise(x*2,y*2,t*1.4)*0.5+noise(x*4,y*4,t*2)*0.25)/1.75;
}

// ── BODY BOUNDS ──
function getBodyBounds() {
  if (!bodyLoaded) return { bx:W*0.2, by:H*0.06, bw:W*0.6, bh:H*0.88 };
  const aspect = bodyImg.width / bodyImg.height;
  let bh = H * 0.92;
  let bw = bh * aspect;
  if (bw > W * 0.62) { bw = W*0.62; bh = bw/aspect; }
  return { bx:(W-bw)/2, by:(H-bh)/2, bw, bh };
}

// ── ORGANIC PAINTING SHAPES (from artist vocabulary) ──
// These SVG-like canvas paths mimic her swirling, organic forms
function drawOrganicShapes(bb) {
  if (state.colorInvasion < 0.05) return;
  const { bx, by, bw, bh } = bb;
  const t = state.time;
  const bias = state.paletteBias;
  const inv = state.colorInvasion;

  ctx.save();

  // ─ Swirling horse/animal-like contour arcs ─
  // Occasionally inject muted accent colors for richness
  const mutedAccents = ['dustyRose','blush','slateBlue','sageGreen','lilac','mauve','ochre','dustyTeal','prussian'];
  const extBias = [...bias, mutedAccents[Math.floor(state.time*0.2 % mutedAccents.length)]];
  const numArcs = Math.floor(5 + inv * 14);
  for (let i=0; i<numArcs; i++) {
    const c = blendColor(i%4===0 ? extBias : bias, (i/numArcs + t*0.05) % 1);
    const alpha = 0.12 + inv*0.28;
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    ctx.lineWidth = 4 + inv*16 + Math.random()*12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const x0 = bx + bw*(0.1+Math.random()*0.8);
    const y0 = by + bh*(0.1+Math.random()*0.8);
    const cpx1 = x0 + (Math.random()-0.5)*bw*0.6;
    const cpy1 = y0 + (Math.random()-0.5)*bh*0.5;
    const cpx2 = x0 + (Math.random()-0.5)*bw*0.5;
    const cpy2 = y0 + (Math.random()-0.5)*bh*0.5;
    const x1 = bx + bw*(0.1+Math.random()*0.8);
    const y1 = by + bh*(0.1+Math.random()*0.8);

    ctx.globalCompositeOperation = 'multiply';
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.bezierCurveTo(cpx1, cpy1, cpx2, cpy2, x1, y1);
    ctx.stroke();
  }

  // ─ Fluid organic blobs (organ-like shapes) ─
  const numBlobs = Math.floor(4 + inv * 12);
  for (let i=0; i<numBlobs; i++) {
    const c = blendColor(bias, Math.random());
    const alpha = 0.07 + inv*0.22;
    const cx = bx + bw*(0.1+Math.random()*0.8);
    const cy = by + bh*(0.1+Math.random()*0.8);
    const rx = bw*(0.04+Math.random()*0.22*inv);
    const ry = bh*(0.03+Math.random()*0.18*inv);
    const rot = Math.random()*Math.PI;
    const noiseX = sn(cx*0.01, cy*0.01, t)*30*inv;
    const noiseY = sn(cy*0.01, cx*0.01, t+1)*25*inv;

    const g = ctx.createRadialGradient(cx+noiseX, cy+noiseY, 0, cx+noiseX, cy+noiseY, Math.max(rx,ry));
    g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},${alpha*2})`);
    g.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
    g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);

    ctx.globalCompositeOperation = i%3===0 ? 'multiply' : i%3===1 ? 'screen' : 'overlay';
    ctx.fillStyle = g;
    ctx.save();
    ctx.translate(cx+noiseX, cy+noiseY);
    ctx.rotate(rot);
    ctx.beginPath();
    // Smooth organic blob via bezier control points
    const pts = 7+Math.floor(Math.random()*5);
    const blobPts = [];
    for (let j=0; j<pts; j++) {
      const angle = (j/pts)*Math.PI*2 + sn(j,i,t)*0.4;
      const r2 = rx*(0.5+Math.random()*1.1) + ry*(0.3+Math.random()*0.8);
      blobPts.push({x:Math.cos(angle)*r2, y:Math.sin(angle)*r2*0.55});
    }
    ctx.moveTo((blobPts[0].x+blobPts[pts-1].x)/2, (blobPts[0].y+blobPts[pts-1].y)/2);
    for (let j=0; j<pts; j++) {
      const p1 = blobPts[j], p2 = blobPts[(j+1)%pts];
      ctx.quadraticCurveTo(p1.x, p1.y, (p1.x+p2.x)/2, (p1.y+p2.y)/2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ─ Thick gestural brushstrokes ─
  const numStrokes = Math.floor(4 + inv * 10);
  for (let i=0; i<numStrokes; i++) {
    const c = blendColor(bias, Math.random());
    const alpha = 0.15 + inv*0.35;
    const x0 = bx + bw*(0.05+Math.random()*0.9);
    const y0 = by + bh*(0.05+Math.random()*0.9);
    const len = bw*(0.08+Math.random()*0.35);
    const angle = Math.random()*Math.PI;
    const width = 6 + inv*30 + Math.random()*18;

    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${alpha})`;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';

    const g2 = ctx.createLinearGradient(x0, y0,
      x0+Math.cos(angle)*len, y0+Math.sin(angle)*len);
    g2.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0)`);
    g2.addColorStop(0.3, `rgba(${c[0]},${c[1]},${c[2]},${alpha})`);
    g2.addColorStop(0.7, `rgba(${c[0]},${c[1]},${c[2]},${alpha*0.7})`);
    g2.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]},0)`);

    ctx.strokeStyle = g2;
    ctx.beginPath();
    const mid1x = x0 + Math.cos(angle)*len*0.33 + (Math.random()-0.5)*40;
    const mid1y = y0 + Math.sin(angle)*len*0.33 + (Math.random()-0.5)*40;
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(mid1x, mid1y, x0+Math.cos(angle)*len, y0+Math.sin(angle)*len);
    ctx.stroke();
  }

  ctx.restore();
}

// ── LONG DRIP LINES (painting drips) ──
function updateDrips(bb) {
  if (!bb) return;
  const { bx, by, bw, bh } = bb;
  const t = state.time;

  if (state.lineDensity > 0.02 && Math.random() < state.lineDensity*0.22) {
    const c = blendColor(state.paletteBias, Math.random());
    const dripW = 0.6+Math.random()*5*state.lineDensity;
    const mainDrip = {
      x: bx+bw*(0.05+Math.random()*0.9),
      y: by+bh*(0.02+Math.random()*0.5),
      len:0, maxLen: bh*(0.3+Math.random()*0.72*state.lineDensity),
      w: dripW, color: c, alpha: 0.45+Math.random()*0.5,
      speed: 0.5+Math.random()*2.2,
      wobble: (Math.random()-0.5)*0.5,
      branches: [], // sub-cracks that split off
      pools: []
    };
    // Spawn 1-3 sub-branches
    const nbr = Math.floor(1+Math.random()*3*state.lineDensity);
    for(let bi=0; bi<nbr; bi++){
      const bc = blendColor(state.paletteBias, Math.random());
      mainDrip.branches.push({
        startFrac: 0.2+Math.random()*0.6,  // when to split off (fraction of maxLen)
        len: 0, maxLen: mainDrip.maxLen*(0.2+Math.random()*0.55),
        dx: (Math.random()-0.5)*2.2,       // lateral drift per unit length
        dy: 0.6+Math.random()*1.2,
        w: dripW*(0.25+Math.random()*0.45),
        color: bc, alpha: mainDrip.alpha*(0.4+Math.random()*0.5),
        ox: 0, oy: 0,                       // spawn position (set when parent reaches startFrac)
        active: false
      });
    }
    state.drips.push(mainDrip);
  }

  for (let d of state.drips) {
    d.len = Math.min(d.len+d.speed, d.maxLen);
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';

    // Main drip line
    const segs = Math.max(2, Math.floor(d.len/3));
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    for (let s=1; s<=segs; s++) {
      const py = d.y + (d.len/segs)*s;
      const px = d.x + d.wobble*(py-d.y)*0.1 + sn(d.x*0.02, py*0.02, t*0.25)*6;
      ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `rgba(${d.color[0]},${d.color[1]},${d.color[2]},${d.alpha})`;
    ctx.lineWidth = d.w; ctx.lineCap = 'round'; ctx.stroke();

    // Activate & grow branches
    for (const br of d.branches) {
      const triggerLen = d.maxLen * br.startFrac;
      if (!br.active && d.len >= triggerLen) {
        // Set spawn position on main drip at triggerLen
        const frac = triggerLen / d.maxLen;
        br.ox = d.x + d.wobble*triggerLen*0.1;
        br.oy = d.y + triggerLen;
        br.active = true;
      }
      if (!br.active) continue;
      br.len = Math.min(br.len + d.speed*0.65, br.maxLen);

      ctx.beginPath();
      ctx.moveTo(br.ox, br.oy);
      const bsegs = Math.max(2, Math.floor(br.len/3));
      for (let s=1; s<=bsegs; s++) {
        const frac = s/bsegs;
        ctx.lineTo(
          br.ox + br.dx * br.len * frac + sn(br.ox*0.03, frac*5, t*0.2)*4,
          br.oy + br.dy * br.len * frac
        );
      }
      ctx.strokeStyle = `rgba(${br.color[0]},${br.color[1]},${br.color[2]},${br.alpha})`;
      ctx.lineWidth = br.w; ctx.lineCap = 'round'; ctx.stroke();

      // Tiny pool at branch tip
      if (br.len >= br.maxLen*0.9) {
        const tx = br.ox + br.dx*br.len, ty = br.oy + br.dy*br.len;
        ctx.fillStyle = `rgba(${br.color[0]},${br.color[1]},${br.color[2]},${br.alpha*0.7})`;
        ctx.beginPath(); ctx.arc(tx, ty, br.w*1.8, 0, Math.PI*2); ctx.fill();
      }
    }

    // Pool at main drip bottom
    if (d.len >= d.maxLen*0.88) {
      const px = d.x + d.wobble*d.len*0.1;
      const py = d.y + d.len;
      ctx.fillStyle = `rgba(${d.color[0]},${d.color[1]},${d.color[2]},${d.alpha*0.8})`;
      ctx.beginPath();
      ctx.ellipse(px, py, d.w*3, d.w*1.8, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
  state.drips = state.drips.filter(d => d.len < d.maxLen);
}

// ── PAINT BLOBS ──
function addPaintBlob(x, y) {
  const c = blendColor(state.paletteBias.length?state.paletteBias:['crimson','rose'], Math.random());
  // Darker versions
  const dc = [c[0]*0.7, c[1]*0.7, c[2]*0.7];
  state.paintBlobs.push({
    x, y, r:3+Math.random()*10, maxR:25+Math.random()*80,
    color: dc, alpha:0.9,
    born: state.time,
    splats: Array.from({length:Math.floor(4+Math.random()*8)}, ()=>({
      angle: Math.random()*Math.PI*2,
      dist: 8+Math.random()*50,
      r: 2+Math.random()*8, alpha:0.4+Math.random()*0.5,
      elongate: 0.3+Math.random()*1.5
    }))
  });
}

function drawPaintBlobs() {
  for (let b of state.paintBlobs) {
    b.r = Math.min(b.r+1.2, b.maxR);
    // Strokes settle - don't fully disappear
    const settled = b.settledAlpha || 0.25;
    if (b.alpha > settled) b.alpha = Math.max(settled, b.alpha - 0.002);
    if (b.alpha<=0) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';

    const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    g.addColorStop(0, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},${b.alpha})`);
    g.addColorStop(0.55, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},${b.alpha*0.5})`);
    g.addColorStop(1, `rgba(${b.color[0]},${b.color[1]},${b.color[2]},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();

    // Paint splatter satellites
    for (let s of b.splats) {
      s.angle += 0.005;
      const sx = b.x+Math.cos(s.angle)*s.dist;
      const sy = b.y+Math.sin(s.angle)*s.dist;
      const sSettled = s.settledAlpha || 0.15;
      if (s.alpha > sSettled) s.alpha = Math.max(sSettled, s.alpha-0.001);
      ctx.fillStyle = `rgba(${b.color[0]},${b.color[1]},${b.color[2]},${s.alpha*b.alpha})`;
      ctx.save();
      ctx.translate(sx,sy);
      ctx.rotate(s.angle);
      ctx.scale(1, s.elongate);
      ctx.beginPath(); ctx.arc(0,0,s.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  // Keep blobs - limit total count to prevent memory overflow
  if (state.paintBlobs.length > 400) state.paintBlobs.splice(0, 50);
}

// ── COLLAGE LAYER (painting-inspired abstract fragments) ──
// Pre-defined organic shape "stamps" drawn fresh each frame based on state
function drawCollageLayer(bb) {
  if (!bb || state.colorInvasion < 0.08) return;
  const { bx, by, bw, bh } = bb;
  const t = state.time;
  const inv = state.colorInvasion;
  const em = state.emotionBlend;

  ctx.save();

  // ─ Large sweeping color field washes (like her painting backgrounds) ─
  const washes = Math.floor(5 + inv*9);
  for (let i=0; i<washes; i++) {
    const c = blendColor(state.paletteBias, (i/washes + t*0.03)%1);
    const dc = [c[0]*0.6, c[1]*0.6, c[2]*0.6]; // darker
    const cx = bx + bw*(0.05 + (i/washes)*0.85 + sn(i,0,t)*0.2);
    const cy = by + bh*(0.1 + Math.sin(i*1.7+t*0.1)*0.35 + 0.35);
    const r = bw*(0.15+inv*0.3+Math.sin(i+t*0.2)*0.1);

    ctx.globalCompositeOperation = i%2===0 ? 'multiply' : 'overlay';
    const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0, `rgba(${dc[0]},${dc[1]},${dc[2]},${0.22+inv*0.32})`);
    g.addColorStop(0.45, `rgba(${dc[0]},${dc[1]},${dc[2]},${0.14+inv*0.22})`);
    g.addColorStop(1, `rgba(${dc[0]},${dc[1]},${dc[2]},0)`);
    ctx.fillStyle = g;
    // Irregular multi-lobe blob shape (not just ellipse)
    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(sn(i,0,t)*0.8);
    ctx.beginPath();
    const lobes = 3+Math.floor(Math.random()*4);
    for (let k=0; k<lobes*2; k++) {
      const ang = (k/lobes/2)*Math.PI*2;
      const rad = r*(k%2===0 ? (0.6+Math.random()*0.7) : (0.3+Math.random()*0.5));
      const px = Math.cos(ang)*rad*(1+sn(k,i,t)*0.3);
      const py = Math.sin(ang)*rad*(0.4+Math.abs(sn(i,1,t))*0.8);
      k===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // ─ Heartbreak: deep blue fractures ─
  if (em.heartbreak > 0.1) {
    ctx.globalCompositeOperation = 'multiply';
    for (let i=0; i<Math.floor(em.heartbreak*22); i++) {
      const c = PALETTE.darkBlue;
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${em.heartbreak*0.65})`;
      ctx.lineWidth = 0.5+Math.random()*3;
      const sx = bx+bw*(0.12+Math.random()*0.76);
      const sy = by+bh*(0.12+Math.random()*0.76);
      ctx.beginPath(); ctx.moveTo(sx,sy);
      let px=sx, py=sy;
      const segs = 4+Math.floor(Math.random()*5);
      for(let j=0; j<segs; j++){
        const nx = px+(Math.random()-0.5)*110; const ny = py+Math.random()*65;
        ctx.lineTo(nx,ny);
        // Branch off
        if(Math.random()<0.45 && em.heartbreak>0.4){
          ctx.save();
          ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${em.heartbreak*0.35})`;
          ctx.lineWidth *= 0.55;
          ctx.beginPath(); ctx.moveTo(nx,ny);
          ctx.lineTo(nx+(Math.random()-0.5)*60, ny+Math.random()*40);
          ctx.stroke(); ctx.restore();
        }
        px=nx; py=ny;
      }
      ctx.stroke();
    }
  }

  // ─ Desire: deep crimson veins radiating ─
  if (em.desire > 0.1) {
    ctx.globalCompositeOperation = 'multiply';
    for (let i=0; i<Math.floor(em.desire*16); i++) {
      const c = PALETTE.deepRed;
      const baseW = 1.5+Math.random()*4;
      ctx.strokeStyle = `rgba(${c[0]},${c[1]},${c[2]},${em.desire*0.6})`;
      ctx.lineWidth = baseW;
      const ox = bx+bw*(0.25+Math.random()*0.5);
      const oy = by+bh*(0.2+Math.random()*0.6);
      const angle = Math.random()*Math.PI*2;
      const len = bw*(0.12+Math.random()*0.38*em.desire);
      const ex = ox+Math.cos(angle)*len, ey = oy+Math.sin(angle)*len;
      ctx.beginPath(); ctx.moveTo(ox,oy);
      ctx.quadraticCurveTo(ox+(Math.random()-0.5)*len*0.8, oy+(Math.random()-0.5)*len*0.8, ex,ey);
      ctx.stroke();
      // Sub-veins branching off
      const branches = Math.floor(1+em.desire*4);
      for(let b=0; b<branches; b++){
        const bt = 0.3+Math.random()*0.6;
        const bx2 = ox+(ex-ox)*bt, by2 = oy+(ey-oy)*bt;
        const bAngle = angle+(Math.random()-0.5)*1.8;
        const bLen = len*(0.2+Math.random()*0.45);
        ctx.save();
        ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${em.desire*0.35})`;
        ctx.lineWidth=baseW*0.45;
        ctx.beginPath(); ctx.moveTo(bx2,by2);
        ctx.lineTo(bx2+Math.cos(bAngle)*bLen, by2+Math.sin(bAngle)*bLen);
        ctx.stroke(); ctx.restore();
      }
    }
  }

  ctx.restore();
}

// ── LACE LAYER (SVG-drawn, no image) ──
function drawLaceLayer(bb) {
  if (!bb || state.laceIntensity < 0.05) return;
  const { bx, by, bw, bh } = bb;
  const t = state.time;
  const li = state.laceIntensity;

  lctx.clearRect(0,0,W,H);

  // Thread lines wrapping the body (calligraphic)
  const numLines = Math.floor(li * 30);
  for (let i=0; i<numLines; i++) {
    const alpha = li*0.22;
    const c = blendColor(state.paletteBias, i/numLines);
    const dc = [c[0]*0.5, c[1]*0.5, c[2]*0.5];

    // Horizontal binding threads
    const y = by + bh*(0.1 + (i/numLines)*0.85);
    const sway = sn(i*0.5, 0, t*0.08)*40*li;
    const x1 = bx + 10 + sway;
    const x2 = bx + bw - 10 + sway*0.5;

    lctx.save();
    lctx.globalAlpha = alpha;
    lctx.strokeStyle = `rgb(${dc[0]},${dc[1]},${dc[2]})`;
    lctx.lineWidth = 0.3+li*0.6;
    lctx.setLineDash(i%3===0?[]:[3,6]);
    lctx.beginPath();
    lctx.moveTo(x1, y);
    lctx.bezierCurveTo(
      x1+(x2-x1)*0.33+sn(i,0,t)*25, y+(Math.random()-0.5)*20*li,
      x1+(x2-x1)*0.66+sn(0,i,t)*25, y+(Math.random()-0.5)*15*li,
      x2, y
    );
    lctx.stroke();
    lctx.setLineDash([]);
    lctx.restore();
  }

  // Vertical threads
  if (li > 0.3) {
    for (let i=0; i<Math.floor(li*15); i++) {
      const x = bx + bw*(0.05 + (i/(li*15))*0.9);
      const alpha = li*0.15;
      const c = blendColor(state.paletteBias, Math.random());
      const dc = [c[0]*0.4, c[1]*0.4, c[2]*0.4];
      lctx.save();
      lctx.globalAlpha = alpha;
      lctx.strokeStyle = `rgb(${dc[0]},${dc[1]},${dc[2]})`;
      lctx.lineWidth = 0.3;
      lctx.setLineDash([2,8]);
      lctx.beginPath();
      lctx.moveTo(x, by+bh*0.05);
      lctx.lineTo(x+sn(x*0.01,0,t)*20, by+bh*0.95);
      lctx.stroke();
      lctx.setLineDash([]);
      lctx.restore();
    }
  }

  // Knot nodes at intersections
  if (li > 0.5) {
    const numKnots = Math.floor(li*20);
    for (let i=0; i<numKnots; i++) {
      const kx = bx+bw*(0.1+Math.random()*0.8);
      const ky = by+bh*(0.1+Math.random()*0.8);
      const kr = 1.5+li*3;
      lctx.save();
      lctx.globalAlpha = li*0.18;
      lctx.strokeStyle = `rgba(${PALETTE.black[0]},${PALETTE.black[1]},${PALETTE.black[2]},0.8)`;
      lctx.lineWidth = 0.6;
      lctx.beginPath(); lctx.arc(kx,ky,kr,0,Math.PI*2); lctx.stroke();
      lctx.restore();
    }
  }

  document.getElementById('lace-canvas').style.opacity = Math.min(li*0.8, 0.8);
}

// ── DRAW BODY WITH LIQUID WARP ──
function drawBody() {
  if (!bodyLoaded) return null;
  const t = state.time;
  const bb = getBodyBounds();
  const { bx, by, bw, bh } = bb;
  const ds = state.deformStrength;

  ctx.save();
  // When frozen, body goes still (no breath, no wave)
  const frozen = state.frozenBody;
  const breathX = frozen ? 0 : Math.sin(t*0.4)*3*state.breathAmt;
  const breathY = frozen ? 0 : Math.cos(t*0.3)*2*state.breathAmt;
  const breathS = frozen ? 1 : 1+Math.sin(t*0.5)*0.008*state.breathAmt;
  ctx.translate(W/2+breathX, H/2+breathY);
  ctx.scale(breathS, breathS);
  ctx.translate(-W/2, -H/2);

  // Clean up expired liquid points
  // Permanent points (set during questioning) never expire
  state.liquidPoints = state.liquidPoints.filter(lp => {
    if (lp.permanent) return true;
    return (state.time - lp.born) < 4.2;
  });

  if (!frozen && ds > 0.05) {
    const strips = Math.min(80, Math.round(24 + ds * 70));
    const sh = bh / strips;
    const srcH = bodyImg.height / strips;

    for (let i = 0; i < strips; i++) {
      const progress = i / strips;
      const sy = srcH * i;
      const dy = by + sh * i;

      // Global wave distortion
      const wave1X = Math.sin(progress * Math.PI * 2.5 + t * 0.8) * ds * 55;
      const wave1Y = Math.cos(progress * Math.PI * 1.8 + t * 0.6) * ds * 18;
      const wave2X = Math.sin(progress * Math.PI * 5.5 + t * 1.4) * ds * 28;
      const wave2Y = Math.cos(progress * Math.PI * 4.2 + t * 1.1) * ds * 12;
      const wave3X = noise(progress * 3, 0, t * 0.5) * ds * 38;
      const wave3Y = noise(0, progress * 3, t * 0.4) * ds * 22;
      const bulge  = Math.sin(progress * Math.PI) * ds * 38;
      let ox = wave1X + wave2X + wave3X + bulge;
      let oy = wave1Y + wave2Y + wave3Y;

      // Click-point local liquid ripples
      const stripCY = dy + sh * 0.5;
      for (const lp of state.liquidPoints) {
        const age = state.time - lp.born;
        const str = lp.strength * Math.max(0, 1 - age * 0.28);
        if (str < 0.01) continue;
        const ddx = (bx + bw * 0.5) - lp.x;
        const ddy = stripCY - lp.y;
        const dist = Math.sqrt(ddx*ddx + ddy*ddy);
        const radius = 150 + str * 220;
        if (dist < radius) {
          const falloff = Math.pow(1 - dist/radius, 1.5);
          const ripple = Math.sin(dist * 0.035 - t * 3.5) * str * 48 * falloff;
          const ang = Math.atan2(ddy, ddx);
          ox += Math.cos(ang + Math.PI*0.5) * ripple;
          oy += Math.sin(ang + Math.PI*0.5) * ripple;
        }
      }

      const widthScale = 1 + Math.sin(progress * Math.PI * 3 + t * 0.7) * ds * 0.22;
      ctx.drawImage(bodyImg, 0, sy, bodyImg.width, srcH+1, bx+ox, dy+oy, bw*widthScale, sh+1);
    }
  } else {
    // Frozen or low deform: static draw
    ctx.drawImage(bodyImg, bx, by, bw, bh);
  }

  ctx.restore();
  return bb;
}

// ── BACKGROUND ──
function drawBackground() {
  ctx.fillStyle = '#06040A';
  ctx.fillRect(0,0,W,H);

  // Very subtle color bleed in bg
  if (state.phase!=='landing' && state.colorInvasion>0.1) {
    const t = state.time;
    ctx.save();
    for (let i=0; i<3; i++) {
      const c = blendColor(state.paletteBias, i/3);
      const dc = [c[0]*0.3, c[1]*0.3, c[2]*0.3];
      const x = W*(0.1+i*0.35+sn(i,0,t)*0.15);
      const y = H*(0.1+sn(0,i,t)*0.3+0.35);
      const r = W*0.25;
      const g = ctx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0, `rgba(${dc[0]},${dc[1]},${dc[2]},0.07)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

// ── DRAG EFFECT ──
function drawDragEffect() {
  if (!state.isDragging || state.dragPoints.length < 2) return;
  pctx.save();
  pctx.globalCompositeOperation = 'multiply';
  for (let i=1; i<state.dragPoints.length; i++) {
    const p1=state.dragPoints[i-1], p2=state.dragPoints[i];
    const c = blendColor(state.paletteBias, i/state.dragPoints.length);
    const dc = [c[0]*0.65, c[1]*0.65, c[2]*0.65];
    pctx.strokeStyle = `rgba(${dc[0]},${dc[1]},${dc[2]},0.55)`;
    pctx.lineWidth = 2+state.colorInvasion*4;
    pctx.lineCap = 'round';
    pctx.beginPath(); pctx.moveTo(p1.x,p1.y); pctx.lineTo(p2.x,p2.y); pctx.stroke();
  }
  pctx.restore();
  pctx.save();
  pctx.globalCompositeOperation = 'destination-out';
  pctx.fillStyle = 'rgba(0,0,0,0.01)';
  pctx.fillRect(0,0,W,H);
  pctx.restore();
}

// ── MAIN RENDER ──
let landingBodyAlpha = 0;
let bodyBounds = null;

function render() {
  state.time += 0.016;
  drawBackground();

  if (state.phase === 'landing') {
    landingBodyAlpha = Math.min(landingBodyAlpha+0.004, 1);
    if (bodyLoaded) {
      const bb = getBodyBounds();
      ctx.save();
      ctx.globalAlpha = landingBodyAlpha*0.45;
      ctx.filter = 'blur(5px) brightness(0.4) saturate(0.3)';
      ctx.translate(Math.sin(state.time*0.3)*3, Math.cos(state.time*0.25)*2);
      ctx.drawImage(bodyImg,bb.bx,bb.by,bb.bw,bb.bh);
      ctx.restore();
    }
    // Deep vignette
    const vg = ctx.createRadialGradient(W/2,H/2,H*0.15,W/2,H/2,H*0.8);
    vg.addColorStop(0,'rgba(6,4,10,0)');
    vg.addColorStop(1,'rgba(6,4,10,0.95)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
    requestAnimationFrame(render); return;
  }

  bodyBounds = drawBody();
  drawCollageLayer(bodyBounds);
  drawOrganicShapes(bodyBounds);
  drawPaintBlobs();
  updateDrips(bodyBounds);
  drawDragEffect();
  drawLaceLayer(bodyBounds);

  // Heavy vignette
  const vg = ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.78);
  vg.addColorStop(0,'rgba(6,4,10,0)');
  vg.addColorStop(1,'rgba(6,4,10,0.88)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(render);
}

  if (state.phase!=='interacting'&&state.phase!=='final') return;
  state.isDragging=true;
  state.dragPoints=[{x:e.clientX,y:e.clientY}];
  cursor.classList.add('active');

  // Each click: strong liquid ripple at cursor + one random visual event
  state.frozenBody = false;
  state.liquidPoints.push({
    x: e.clientX, y: e.clientY,
    strength: 1.1 + Math.random()*0.8,
    born: state.time,
    permanent: false  // click ripples fade naturally
  });
  if (state.liquidPoints.length > 40) state.liquidPoints.shift();

  // Random visual event — one of 5 types, cycles for variety
  const PALETTES = [
    ['crimson','blood','rose'],['electricBlue','darkBlue','prussian'],
    ['flesh','dustyRose','blush'],['darkPink','lilac','mauve'],
    ['green','sageGreen','teal'],['ochre','gold','sienna']

  const events = [
    () => { // palette shift
      state.paletteBias = PALETTES[Math.floor(Math.random()*PALETTES.length)];
    },
    () => { // drip burst from click point
      state.lineDensity = Math.min(state.lineDensity+0.12, 0.98);
      const bb=getBodyBounds();
      for(let i=0;i<4;i++) setTimeout(()=>{
        const c=blendColor(state.paletteBias,Math.random());
        state.drips.push({

          y: e.clientY,

          branches:[]
        });
      }, i*50);
    },
    () => { // paint splatter at click
      for(let i=0;i<5;i++) addPaintBlob(

      state.deformStrength = Math.min(state.deformStrength+0.07, 0.97);

  addPaintBlob(e.clientX, e.clientY);
});

// ── APPLY PARAMS ──
function applyParams(p) {
  if (!p) return;
  if (p.emotionBlend) state.emotionBlend=p.emotionBlend;
  if (p.motionTags) {
    state.motionTags=p.motionTags;
    if (p.motionTags.includes('stretch')) state.deformStrength=Math.min(state.deformStrength+0.18,0.95);
    if (p.motionTags.includes('bind')) state.laceIntensity=Math.min(state.laceIntensity+0.25,1);
    if (p.motionTags.includes('tremble')) state.breathAmt=Math.min(state.breathAmt+0.7,3.5);
    if (p.motionTags.includes('bloom')) state.colorInvasion=Math.min(state.colorInvasion+0.15,0.95);
  }
  if (p.paletteBias) {
    const map={crimson:'crimson',flesh:'flesh',electric_blue:'electricBlue',
      pink:'pink',blood:'blood',rose:'rose',yellow:'acidYellow',green:'green',blue:'lakeBlue'};
    state.paletteBias=p.paletteBias.map(b=>map[b]||b).filter(k=>PALETTE[k]);
    if (!state.paletteBias.length) state.paletteBias=['crimson','flesh'];
  }
  if (p.paintTakeoverRatio!=null) state.colorInvasion=p.paintTakeoverRatio;
  if (p.lineDensity!=null) state.lineDensity=p.lineDensity;
  if (p.laceBindingIntensity!=null) state.laceIntensity=Math.max(state.laceIntensity, p.laceBindingIntensity);
}

async function callStyleEngine(answers) {
  // Detect language from answers
  const allText = answers.join(' ');
  const cnChars = (allText.match(/[\u4e00-\u9fff]/g)||[]).length;
  const isChinese = cnChars > allText.replace(/\s/g,'').length * 0.2;
  const poemInstruction = isChinese
    ? 'poem: write exactly 3 lines of Chinese poetry, dark and bodily, max 12 chars per line'
    : 'poem: write exactly 3 lines of English poetry, dark and bodily, max 10 words per line';

  const sys = `You are a visual style engine for a body art installation about desire, heartbreak and longing.
Artist style: deep crimson/blood red, electric blue accents, acid yellow, flesh tones, organic forms, dripping paint, lace threads, horse motifs.
Answers may be in Chinese or English. Output ONLY valid JSON, no other text:
{"emotionBlend":{"desire":0.0,"heartbreak":0.0,"longing":0.0,"shame":0.0},"motionTags":["stretch"],"paletteBias":["crimson"],"textureMetaphors":["silk"],"paintTakeoverRatio":0.5,"lineDensity":0.5,"laceBindingIntensity":0.4,"regionFocus":["abdomen"],"motifHints":["word"],"deformationOrder":["expand"],"poem":"line1\\nline2\\nline3","quoteIndex":0}
Replace all values. ${poemInstruction}. For quoteIndex pick integer 0-19 most emotionally resonant with answers (0=pain/radiance, 1=giving, 2=hope to be seen, 3=emotion investment, 4=whale/sea, 5=nerves spring, 6=self ridiculous, 7=body resource, 8=retreat, 9=stop loving, 10=fresh mistakes, 11=fish ripples, 12=trembling hands, 13=trapped beast, 14=name taboo, 15=given everything, 16=mistake love, 17=not same world, 18=look/breathe, 19=live happily).`;
  const usr = `Q1: ${answers[0]}
Q2: ${answers[1]}
Q3: ${answers[2]}
Q4: ${answers[3]}`;
  // isChinese is defined above
  try {
    const r = await fetch('https://a-catalogue-of-temptation329.vercel.app/api/proxy',{
      method:'POST', headers:{
        'Content-Type':'application/json',
      },
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,
        system:sys,messages:[{role:'user',content:usr}]})
    });
    const d = await r.json();
    const txt = d.content?.[0]?.text||'{}';
    return JSON.parse(txt.replace(/```json|```/g,'').trim());
  } catch(e) {
    return {
      emotionBlend:{desire:0.6,heartbreak:0.45,longing:0.7,shame:0.25},
      motionTags:['stretch','bind','tremble','bloom'],
      paletteBias:['crimson','flesh','electricBlue'],
      paintTakeoverRatio:0.75, lineDensity:0.65, laceBindingIntensity:0.55,
      poem:'the body received what you gave\nand gave back something else entirely\nneither of you unchanged'
    };
  }
}

    const liquidStrengths = [0, 0.55, 0.85, 1.25]; // Q1=none, Q2-Q4 escalate
    const liquidCounts    = [0, 5,    9,    14  ];
    const lStr = liquidStrengths[idx];
    const lCnt = liquidCounts[idx];
    const bb0 = getBodyBounds();
    for (let k=0; k<lCnt; k++) {
      setTimeout(() => {
        state.liquidPoints.push({
          x: bb0.bx + bb0.bw*(0.10+Math.random()*0.80),
          y: bb0.by + bb0.bh*(0.10+Math.random()*0.80),
          strength: lStr*(0.75+Math.random()*0.60),
          born: state.time,
          permanent: true   // never expire during questioning
        });
        if (state.liquidPoints.length > 40) state.liquidPoints.shift();
      }, k * 110);
    }
    const deformBoosts = [0, 0.22, 0.20, 0.18];
    state.deformStrength = Math.min(state.deformStrength + deformBoosts[idx], 0.94);
    state.frozenBody = false; // unfreeze — liquid runs continuously, no re-freeze
  }

  const fx=[
    ()=>{ state.colorInvasion=Math.min(state.colorInvasion+0.15,0.50); state.paletteBias=['flesh','rose','gold']; state.breathAmt=2.0; },
    ()=>{ state.colorInvasion=Math.min(state.colorInvasion+0.2,0.65); state.paletteBias=['crimson','blood','rose','deepRed']; state.breathAmt=2.5; },
    ()=>{ state.emotionBlend.heartbreak=0.55; state.paletteBias=['electricBlue','darkBlue','maroon']; state.laceIntensity=Math.min(state.laceIntensity+0.2,0.6); state.lineDensity=Math.min(state.lineDensity+0.2,0.5); },
    ()=>{ state.lineDensity=Math.min(state.lineDensity+0.35,0.85); state.paletteBias=['blood','darkPink','electricBlue','maroon']; }
  ];
  fx[idx]?.();
}

async function submitAnswer() {
  const v = answerInput.value.trim();
  if (!v) return;
  state.answers.push(v);

  // Text length drives visual intensity (supports Chinese & English)
  // Chinese chars count double as they're more semantic per character
  const chineseChars = (v.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g)||[]).length;
  const latinWords = v.split(/\s+/).filter(w=>w.length>0).length;
  const richness = Math.min(1, (chineseChars*2 + latinWords) / 18); // 0-1 scale
  
  const blobCount = Math.round(2 + richness * 10);
  for(let i=0;i<blobCount;i++) setTimeout(()=>addPaintBlob(
    W/2+(Math.random()-0.5)*400, H*(0.2+Math.random()*0.6)), i*80);

  // Scale visual params by richness
  state.colorInvasion = Math.min(state.colorInvasion + 0.06 + richness*0.18, 0.92);
  state.lineDensity   = Math.min(state.lineDensity   + 0.05 + richness*0.20, 0.95);
  state.laceIntensity = Math.min(state.laceIntensity + 0.03 + richness*0.10, 1.0);
  if (richness > 0.5) state.deformStrength = Math.min(state.deformStrength + richness*0.12, 0.88);

  // Freeze body still after answer
  state.frozenBody = true;

  if (state.currentQ < QUESTIONS.length-1) {
    state.currentQ++;
    qText.classList.remove('visible');
    setTimeout(()=>showQuestion(state.currentQ),400);
  } else {
    questionUI.classList.remove('visible');
    processingUI.classList.add('visible');
    state.phase='processing';
    state.frozenBody = false; // liquid keeps running
    // Lock all current liquid points as permanent — preserve Q4 shape
    state.liquidPoints.forEach(lp => { lp.permanent = true; });
    state.colorInvasion=Math.min(state.colorInvasion+0.20,0.92);
    state.deformStrength=Math.min(state.deformStrength+0.18,0.88);
    state.lineDensity=Math.min(state.lineDensity+0.22,0.95);
    const finalBlobs = Math.round(8 + richness*10);
    for(let i=0;i<finalBlobs;i++) setTimeout(()=>addPaintBlob(W/2+(Math.random()-0.5)*500,H*(0.15+Math.random()*0.7)),i*150);

    const params = await callStyleEngine(state.answers);
    state.visualParams=params;
    setTimeout(()=>{
      applyParams(params);
      processingUI.classList.remove('visible');
      state.phase='interacting';
      interactHint.style.opacity='0.5'; dragHint.style.opacity='0.5';
      const clickHintEl = document.getElementById('click-hint');
      if (clickHintEl) clickHintEl.style.opacity='1';
      setTimeout(()=>showFinal(params), 8000);
    }, 1500);
  }
}

function showFinal(p) {
  state.phase='final';
  interactHint.style.opacity='0'; dragHint.style.opacity='0';
  const _ch = document.getElementById('click-hint'); if(_ch) _ch.style.opacity='0';
  state.breathAmt=0.3; state.laceIntensity=Math.min(state.laceIntensity+0.25,1);

  // Detect language from all answers
  const allTxt = state.answers.join(' ');
  const cnCount = (allTxt.match(/[\u4e00-\u9fff]/g)||[]).length;
  const isCn = cnCount > allTxt.replace(/\s/g,'').length * 0.2;

  // Poem (language-matched fallback)
  const fallback = isCn
    ? '\u8eab\u4f53\u6536\u4e0b\u4f60\u7684\u8bed\u8a00<br>\u5b83\u8fd8\u7ed9\u4f60\u4e00\u4e2a\u5f62\u6001<br>\u4e24\u8005\u90fd\u5df2\u6539\u53d8'
    : 'the body received what you gave<br>and gave back something else entirely<br>neither of you unchanged';
  finalPoem.innerHTML = p && p.poem ? p.poem.split('\n').join('<br>') : fallback;

  // Mirror Chamber quote (chosen by AI or random)
  const qi = (p && p.quoteIndex >= 0 && p.quoteIndex < MIRROR_QUOTES.length)
    ? Math.round(p.quoteIndex) : Math.floor(Math.random()*MIRROR_QUOTES.length);
  const q = MIRROR_QUOTES[qi];
  state.selectedQuote = isCn ? q.cn : q.en;
  const qEl = document.getElementById('final-quote');
  if (qEl) qEl.innerHTML = '\u201c' + state.selectedQuote + '\u201d';

  finalUI.classList.add('visible');
}

submitBtn.addEventListener('click',submitAnswer);
answerInput.addEventListener('keydown',e=>{ if(e.key==='Enter') submitAnswer(); });

document.getElementById('save-btn').addEventListener('click',()=>{
  const sc=document.createElement('canvas'); sc.width=W; sc.height=H;
  const sctx=sc.getContext('2d');
  sctx.drawImage(mainC,0,0); sctx.drawImage(paintC,0,0); sctx.drawImage(laceC,0,0);

  sctx.save();
  sctx.textAlign = 'center';

  // Helper: wrap text for both Latin (word-wrap) and Chinese (char-wrap)
  function wrapText(ctx, text, maxW) {
    const isChinese = /[\u4e00-\u9fff]/.test(text);
    const out = [];
    if (isChinese) {
      // Wrap character by character for CJK
      let cur = '';
      for (const ch of text) {
        if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; }
        else cur += ch;
      }
      if (cur) out.push(cur);
    } else {
      // Word-wrap for Latin
      let cur = '';
      for (const w of text.split(' ')) {
        const test = cur ? cur+' '+w : w;
        if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w; }
        else cur = test;
      }
      if (cur) out.push(cur);
    }
    return out;
  }

  // ── Poem lines (extract from innerHTML using <br> as separator) ──
  const rawPoem = finalPoem.innerHTML || '';
  const pLines = rawPoem.split(/<br\s*\/?>/i)
    .map(l => l.replace(/<[^>]+>/g,'').trim()).filter(Boolean);

  const pSize = Math.round(H * 0.022);
  sctx.font = `italic ${pSize}px Georgia, 'Noto Serif SC', serif`;
  sctx.fillStyle = 'rgba(230,200,175,0.82)';
  const py0 = H * 0.75;
  const pLineH = H * 0.030;
  pLines.forEach((ln, i) => sctx.fillText(ln, W/2, py0 + i * pLineH));

  // ── Mirror Chamber quote ──
  const qt = (state.selectedQuote || '').trim();
  if (qt) {
    const qSize = Math.round(H * 0.016);
    sctx.font = `italic ${qSize}px Georgia, 'Noto Serif SC', serif`;
    sctx.fillStyle = 'rgba(200,155,130,0.52)';
    const maxW = W * 0.60;
    const qLines = wrapText(sctx, qt, maxW).slice(0, 4);
    const qy0 = py0 + pLines.length * pLineH + H * 0.036;
    const qLineH = H * 0.023;
    qLines.forEach((l, i) => {
      const isFirst = i === 0, isLast = i === qLines.length - 1;
      sctx.fillText((isFirst ? '\u201c' : '') + l + (isLast ? '\u201d' : ''), W/2, qy0 + i * qLineH);
    });
  }

  sctx.restore();

  const a = document.createElement('a');
  a.download = 'catalogue-of-temptations.png';
  a.href = sc.toDataURL('image/png', 0.95);
  a.click();
});

document.getElementById('restart-btn').addEventListener('click',()=>location.reload());

// Touch
document.addEventListener('touchstart',e=>{
  if(state.phase!=='interacting'&&state.phase!=='final') return;
  const t=e.touches[0]; addPaintBlob(t.clientX,t.clientY);
  state.laceIntensity=Math.min(state.laceIntensity+0.05,1);
});
document.addEventListener('touchmove',e=>{
  if(state.phase!=='interacting'&&state.phase!=='final') return;
  e.preventDefault();
  const t=e.touches[0];
  state.dragPoints.push({x:t.clientX,y:t.clientY});
  if(state.dragPoints.length>50) state.dragPoints.shift();
  state.deformStrength=Math.min(state.deformStrength+0.007,0.9);
},{passive:false});
document.addEventListener('touchend',()=>{ state.dragPoints=[]; });

render();
</script>
